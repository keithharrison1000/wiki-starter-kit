[project]
name = "wiki"
version = "0.1.0"
description = "Local infrastructure for a multi-vault, OKF-format personal wiki"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "lancedb>=0.15",
    "ollama>=0.4",
    "pymupdf>=1.24",
    "pymupdf4llm>=0.2.6",
    "pymupdf-layout>=1.28",
    "docling>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "markdown>=3.7",
    "anthropic>=0.40",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
wiki-ingest = "wiki.ingest:main"
wiki-index = "wiki.index:main"
wiki-query = "wiki.query:main"
wiki-new-vault = "wiki.new_vault:main"
wiki-refresh = "wiki.refresh:main"
wiki-lint = "wiki.lint:main"
wiki-doctor = "wiki.doctor:main"
wiki-outline = "wiki.outline:main"
wiki-web = "wiki.web.app:main"
pdf2md = "wiki.convert.pdf2md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/wiki"]
